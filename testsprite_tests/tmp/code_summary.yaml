version: "2"
type: frontend
tech_stack:
  - language: TypeScript
  - framework: Next.js 16
  - ui_library: React 19, Radix UI, TailwindCSS
  - other: Socket.io, React Query, Zustand, React Hook Form
routes:
  - path: /
    file: app/(public)/(landing)/page.tsx
    auth_required: false
    description: Public landing page
  - path: /login
    file: app/(public)/(auth)/login/page.tsx
    auth_required: false
    description: User login page with email and password
  - path: /register
    file: app/(public)/(auth)/register/page.tsx
    auth_required: false
    description: User registration page
  - path: /email-verify
    file: app/(public)/(auth)/(verify)/email/page.tsx
    auth_required: false
    description: Email verification page
  - path: /complete-profile
    file: app/(public)/complete-profile/page.tsx
    auth_required: false
    description: Complete user profile after registration
  - path: /reset/password
    file: app/(public)/reset/password/page.tsx
    auth_required: false
    description: Password reset request page
  - path: /reset/password/change
    file: app/(public)/reset/password/change/page.tsx
    auth_required: false
    description: Password change confirmation page
  - path: /home
    file: app/(private)/(main)/(user)/home/page.tsx
    auth_required: true
    description: User home dashboard
  - path: /auctions
    file: app/(private)/(main)/auctions/page.tsx
    auth_required: true
    description: List all available auctions for browsing and bidding
  - path: /auctions/[id]
    file: app/(private)/(main)/auctions/[id]/page.tsx
    auth_required: true
    description: Auction detail page
  - path: /auction/[id]
    file: app/(private)/(main)/auction/[id]/page.tsx
    auth_required: true
    description: Alternative auction detail page
  - path: /profile
    file: app/(private)/(main)/profile/page.tsx
    auth_required: true
    description: User profile page
  - path: /profile/my-auctions
    file: app/(private)/(main)/profile/my-auctions/page.tsx
    auth_required: true
    description: User's participated auctions
  - path: /profile/wallet
    file: app/(private)/(main)/profile/wallet/page.tsx
    auth_required: true
    description: User wallet and balance
  - path: /profile/payments
    file: app/(private)/(main)/profile/payments/page.tsx
    auth_required: true
    description: Payment history
  - path: /profile/notifications
    file: app/(private)/(main)/profile/notifications/page.tsx
    auth_required: true
    description: User notifications
  - path: /profile/subscription
    file: app/(private)/(main)/profile/subscription/page.tsx
    auth_required: true
    description: Subscription management
  - path: /seller/landing
    file: app/(private)/(main)/seller/landing/page.tsx
    auth_required: true
    description: Seller landing page
  - path: /seller/dashboard
    file: app/(private)/(main)/seller/dashboard/page.tsx
    auth_required: true
    description: Seller dashboard with metrics
  - path: /seller/auction/create
    file: app/(private)/(main)/seller/auction/create/page.tsx
    auth_required: true
    description: Create new auction
  - path: /seller/auction/[id]
    file: app/(private)/(main)/seller/auction/[id]/page.tsx
    auth_required: true
    description: View seller's auction
  - path: /seller/auction/[id]/edit
    file: app/(private)/(main)/seller/auction/[id]/edit/page.tsx
    auth_required: true
    description: Edit seller's auction
  - path: /seller/auction/[id]/draft
    file: app/(private)/(main)/seller/auction/[id]/draft/page.tsx
    auth_required: true
    description: Seller's draft auction
  - path: /seller/auctions
    file: app/(private)/(main)/seller/auctions/page.tsx
    auth_required: true
    description: List all seller's auctions
  - path: /seller/auction
    file: app/(private)/(main)/seller/auction/page.tsx
    auth_required: true
    description: Seller auction management
  - path: /seller/auction/categories
    file: app/(private)/(main)/seller/auction/categories/page.tsx
    auth_required: true
    description: Auction categories available for sellers
  - path: /seller/auction/categories/request
    file: app/(private)/(main)/seller/auction/categories/request/page.tsx
    auth_required: true
    description: Request new auction category
  - path: /seller/auction/categories/my-requests
    file: app/(private)/(main)/seller/auction/categories/my-requests/page.tsx
    auth_required: true
    description: View seller's category requests
  - path: /seller/kyc
    file: app/(private)/(main)/seller/kyc/page.tsx
    auth_required: true
    description: Seller KYC verification
  - path: /seller/payments
    file: app/(private)/(main)/seller/payments/page.tsx
    auth_required: true
    description: Seller payment management
  - path: /admin/dashboard
    file: app/(private)/(admin)/admin/dashboard/page.tsx
    auth_required: true
    description: Admin dashboard
  - path: /admin/users
    file: app/(private)/(admin)/admin/users/page.tsx
    auth_required: true
    description: Manage users
  - path: /admin/users/[id]
    file: app/(private)/(admin)/admin/users/[id]/page.tsx
    auth_required: true
    description: User detail page
  - path: /admin/users/suspended
    file: app/(private)/(admin)/admin/users/suspended/page.tsx
    auth_required: true
    description: Suspended users list
  - path: /admin/sellers
    file: app/(private)/(admin)/admin/sellers/page.tsx
    auth_required: true
    description: Manage sellers
  - path: /admin/sellers/[id]
    file: app/(private)/(admin)/admin/sellers/[id]/page.tsx
    auth_required: true
    description: Seller detail page
  - path: /admin/auctions
    file: app/(private)/(admin)/admin/auctions/page.tsx
    auth_required: true
    description: Manage all auctions
  - path: /admin/auctions/[id]
    file: app/(private)/(admin)/admin/auctions/[id]/page.tsx
    auth_required: true
    description: Auction detail for admin
  - path: /admin/auctions/categories
    file: app/(private)/(admin)/admin/auctions/categories/page.tsx
    auth_required: true
    description: Manage auction categories
  - path: /admin/auctions/requests
    file: app/(private)/(admin)/admin/auctions/requests/page.tsx
    auth_required: true
    description: Manage category requests
  - path: /admin/subscriptions
    file: app/(private)/(admin)/admin/subscriptions/page.tsx
    auth_required: true
    description: Manage subscriptions
  - path: /admin/subscriptions/create
    file: app/(private)/(admin)/admin/subscriptions/create/page.tsx
    auth_required: true
    description: Create subscription plan
  - path: /admin/subscriptions/features
    file: app/(private)/(admin)/admin/subscriptions/features/page.tsx
    auth_required: true
    description: Manage subscription features
  - path: /admin/subscriptions/users
    file: app/(private)/(admin)/admin/subscriptions/users/page.tsx
    auth_required: true
    description: Manage subscription users
  - path: /admin/reports
    file: app/(private)/(admin)/admin/reports/page.tsx
    auth_required: true
    description: View reports and analytics
  - path: /admin/config
    file: app/(private)/(admin)/admin/config/page.tsx
    auth_required: true
    description: Platform configuration
features:
  - name: User Authentication
    description: Login, register, email verification, and password reset
    files:
      - app/(public)/(auth)/login/page.tsx
      - app/(public)/(auth)/register/page.tsx
      - app/(public)/(auth)/(verify)/email/page.tsx
      - app/(public)/reset/password/page.tsx
    entry_route: /login
    user_interactions:
      - Navigate to login page
      - Enter email and password
      - Click login button
      - Or navigate to register page
      - Enter registration details
      - Verify email
    api_calls:
      - method: POST
        endpoint: /auth/login
      - method: POST
        endpoint: /auth/register
      - method: POST
        endpoint: /auth/verify-email
    auth_required: false
  - name: Browse Auctions
    description: Browse and view available auctions
    files:
      - app/(private)/(main)/auctions/page.tsx
      - app/(private)/(main)/auctions/[id]/page.tsx
    entry_route: /auctions
    user_interactions:
      - Navigate to auctions page
      - View list of available auctions
      - Click on auction to see details
      - View auction status and bids
    api_calls:
      - method: GET
        endpoint: /auctions
      - method: GET
        endpoint: /auctions/[id]
    auth_required: true
  - name: Bidding on Auctions
    description: Place and manage bids on auctions
    files:
      - app/(private)/(main)/auctions/[id]/page.tsx
      - app/(private)/(main)/profile/wallet/page.tsx
    entry_route: /auctions/[id]
    user_interactions:
      - Navigate to auction detail page
      - Enter bid amount
      - Click place bid button
      - View bid confirmation
    api_calls:
      - method: POST
        endpoint: /auctions/[id]/bid
      - method: GET
        endpoint: /auctions/[id]
    auth_required: true
  - name: Seller Dashboard
    description: Seller can create and manage auctions
    files:
      - app/(private)/(main)/seller/dashboard/page.tsx
      - app/(private)/(main)/seller/auction/create/page.tsx
      - app/(private)/(main)/seller/auction/[id]/page.tsx
      - app/(private)/(main)/seller/auction/[id]/edit/page.tsx
    entry_route: /seller/dashboard
    user_interactions:
      - Navigate to seller dashboard
      - View auction metrics
      - Click create auction
      - Fill auction details
      - Submit auction
      - View or edit existing auctions
    api_calls:
      - method: GET
        endpoint: /seller/dashboard
      - method: POST
        endpoint: /seller/auctions
      - method: GET
        endpoint: /seller/auctions
      - method: PUT
        endpoint: /seller/auctions/[id]
    auth_required: true
  - name: Admin Management
    description: Admin controls for users, sellers, and auctions
    files:
      - app/(private)/(admin)/admin/dashboard/page.tsx
      - app/(private)/(admin)/admin/users/page.tsx
      - app/(private)/(admin)/admin/sellers/page.tsx
      - app/(private)/(admin)/admin/auctions/page.tsx
    entry_route: /admin/dashboard
    user_interactions:
      - Navigate to admin dashboard
      - View platform metrics
      - Navigate to users/sellers/auctions tabs
      - Search and filter data
      - Perform admin actions
    api_calls:
      - method: GET
        endpoint: /admin/dashboard
      - method: GET
        endpoint: /admin/users
      - method: GET
        endpoint: /admin/sellers
      - method: GET
        endpoint: /admin/auctions
    auth_required: true
  - name: User Profile
    description: User profile management including wallet and subscriptions
    files:
      - app/(private)/(main)/profile/page.tsx
      - app/(private)/(main)/profile/wallet/page.tsx
      - app/(private)/(main)/profile/subscription/page.tsx
      - app/(private)/(main)/profile/notifications/page.tsx
    entry_route: /profile
    user_interactions:
      - Navigate to profile
      - View personal information
      - Update profile
      - View wallet balance
      - View payments
      - Manage subscriptions
    api_calls:
      - method: GET
        endpoint: /users/profile
      - method: PUT
        endpoint: /users/profile
      - method: GET
        endpoint: /users/wallet
    auth_required: true
  - name: KYC Verification
    description: Seller KYC verification process
    files:
      - app/(private)/(main)/seller/kyc/page.tsx
    entry_route: /seller/kyc
    user_interactions:
      - Navigate to KYC page
      - Fill verification form
      - Upload documents
      - Submit verification
    api_calls:
      - method: POST
        endpoint: /seller/kyc
      - method: GET
        endpoint: /seller/kyc
    auth_required: true
known_limitations:
  - issue: Some private routes may have dynamic content from external APIs
    location: app/(private)/**
    impact: Tests may need to mock API responses for consistent results
